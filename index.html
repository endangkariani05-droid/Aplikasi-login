<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSpace - Perpustakaan Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>📚 BookSpace</h2>
    <nav>
        <a href="#koleksi">Koleksi Buku</a>
        <a href="#bukuSaya">Buku Saya</a>
        <button id="logoutBtn" class="hidden">Logout</button>
    </nav>
</header>

<main>
    <!-- HALAMAN LOGIN -->
    <section id="authSection" class="auth">
        <div class="hero">
            <h1>Selamat Datang di BookSpace</h1>
            <p>Temukan ilmu dan pengetahuan melalui buku favoritmu.</p>
            <div class="books">📘 📗 📙 📕</div>
        </div>

        <div class="login-box">
            <div class="tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="registerTab">Daftar</button>
            </div>

            <form id="loginForm">
                <h2>Login Akun</h2>
                <input type="text" id="loginUsername"
                    placeholder="Username" required>

                <input type="password" id="loginPassword"
                    placeholder="Password" required>

                <button type="submit">Masuk</button>
            </form>

            <form id="registerForm" class="hidden">
                <h2>Daftar Akun</h2>
                <input type="text" id="registerName"
                    placeholder="Nama Lengkap" required>

                <input type="text" id="registerUsername"
                    placeholder="Buat Username" minlength="3" required>

                <input type="password" id="registerPassword"
                    placeholder="Buat Password" minlength="4" required>

                <button type="submit">Daftar</button>
            </form>

            <p id="authMessage"></p>
        </div>
    </section>

    <!-- DASHBOARD -->
    <section id="appSection" class="hidden">

        <div class="welcome">
            <h1>Halo, <span id="userName"></span>! 👋</h1>
            <p>Selamat datang di perpustakaan digital BookSpace.</p>
        </div>

        <section id="koleksi">
            <h2>📚 Koleksi Buku</h2>
            <input type="text" id="searchInput"
                placeholder="Cari judul atau penulis buku...">

            <div id="bookGrid" class="book-grid"></div>
        </section>

        <section id="bukuSaya">
            <h2>📖 Buku Saya</h2>
            <div id="loanList"></div>
        </section>

    </section>
</main>

<footer>
    <p>© 2026 BookSpace | Perpustakaan Digital</p>
</footer>

<script src="script.js"></script>
</body>
</html>
